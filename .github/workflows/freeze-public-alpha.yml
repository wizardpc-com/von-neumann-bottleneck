name: Prepare Windows Alpha 2 package

on:
  workflow_dispatch:
    inputs:
      test_batch:
        description: Immutable public playtest batch
        required: true
        type: string
      feedback_endpoint:
        description: Approved public HTTPS API root
        required: true
        type: string
      privacy_url:
        description: Published HTTPS privacy notice
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.1
      TEST_BATCH: ${{ inputs.test_batch }}
      FEEDBACK_ENDPOINT: ${{ inputs.feedback_endpoint }}
      PRIVACY_URL: ${{ inputs.privacy_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download official Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vnb-godot"
          mkdir -p "$root"
          cd "$root"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          engine_archive="Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          templates_archive="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location "$release/$engine_archive" --output "$engine_archive"
          curl --fail --location "$release/$templates_archive" --output "$templates_archive"
          curl --fail --location "$release/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          for file in "$engine_archive" "$templates_archive"; do
            awk -v file="$file" '$2 == file || $2 == "*" file {print}' SHA512-SUMS.txt > "$file.sha512"
            test -s "$file.sha512"
            shasum -a 512 --check "$file.sha512"
          done
          unzip -q "$engine_archive"
          xattr -dr com.apple.quarantine Godot.app 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/vnb-templates"
          mkdir -p "$RUNNER_TEMP/vnb-templates"
          unzip -q "$templates_archive" -d "$RUNNER_TEMP/vnb-templates"
          template_dir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          cp -R "$RUNNER_TEMP/vnb-templates/templates/." "$template_dir/"
          "$root/Godot.app/Contents/MacOS/Godot" --version
          test -f "$template_dir/windows_release_x86_64.exe"

      - name: Build immutable Windows public-playtest package from this commit
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/vnb-godot/Godot.app/Contents/MacOS/Godot"
          windows_template="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/windows_release_x86_64.exe"
          python3 scripts/build-free-candidate.py --godot "$godot" --commit "$GITHUB_SHA" \
            --platform Windows --windows-template "$windows_template" \
            --second-act-profile CloudPlaytest --creation-journey \
            --public-playtest --release-version v0.5.0-alpha.2 \
            --test-batch "$TEST_BATCH" --feedback-endpoint "$FEEDBACK_ENDPOINT" --privacy-url "$PRIVACY_URL"

      - name: Verify package identity and hashes
        shell: bash
        run: |
          set -euo pipefail
          build_id="playtest-${TEST_BATCH}-${GITHUB_SHA:0:12}"
          python3 scripts/check-candidate-identity.py "build/$build_id"
          python3 - "$build_id" <<'PY'
          import json, pathlib, sys
          build_id=sys.argv[1]
          manifest=json.loads((pathlib.Path('build')/build_id/'manifest.json').read_text())
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload package for separate external acceptance
        uses: actions/upload-artifact@v4
        with:
          name: windows-alpha2-unverified-${{ github.sha }}
          path: |
            build/playtest-*/Von-Neumann-Bottleneck-Windows-playtest-*.zip
            build/playtest-*/manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
