# Install as vnb-feedback-public.service.d/50-release.conf only at cutover.
[Unit]
Requires=vnb-release-receiver.service
After=vnb-release-receiver.service

[Service]
CPUAccounting=true
MemoryAccounting=true
MemorySwapMax=0
IOAccounting=true
IOWeight=10
IOReadBandwidthMax=/dev/vda 1M
IOWriteBandwidthMax=/dev/vda 1M
LogRateLimitIntervalSec=30s
LogRateLimitBurst=100
Environment=VNB_FEEDBACK_UPSTREAM_PORT=18082
LoadCredential=edge.token:/etc/vnb-feedback-release/edge.token
LoadCredential=vnb-release-upstream-auth.caddy:/srv/ray/apps/vnb/current-release/server/deploy/vnb-release-upstream-auth.caddy
ExecStart=
ExecStart=/bin/sh /srv/ray/apps/vnb/current-release/server/deploy/run-release-edge.sh /usr/bin/caddy run --config /etc/vnb-feedback-public/Caddyfile --adapter caddyfile
